name: cca

services:
  web:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: :80
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Runs "messenger:consume": takes messages from RabbitMQ and calls their handlers.
  # Same image as "web", but without the web server. The code is read from the mounted project folder.
  worker:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php bin/console messenger:consume async -vv --time-limit=3600 --memory-limit=128M
    # The worker stops by design after the time limit (to free memory); Docker starts it again.
    restart: unless-stopped
    # The image's healthcheck asks Caddy (localhost:2019); the worker does not run Caddy.
    healthcheck:
      disable: true
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    # The "management" image adds a web UI (http://localhost:15672, user/password: guest/guest).
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  database:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: cca
      MYSQL_USER: cca
      MYSQL_PASSWORD: cca
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  db-data:
  rabbitmq-data:
