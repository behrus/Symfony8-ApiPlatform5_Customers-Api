api_platform:
    title: CCA - Customer Contact API
    version: 1.0.0
    eager_loading:
        force_eager: false
    formats:
        jsonld: ['application/ld+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        extra_properties:
            standard_put: false
    swagger:
        # Adds the "Authorize" field to Swagger UI: the token is sent as the x-api-key header.
        api_keys:
            apiKey:
                name: x-api-key
                type: header
    serializer:
        # API Platform 4 turns the "hydra:" prefix off by default; keep it for existing clients.
        hydra_prefix: true
